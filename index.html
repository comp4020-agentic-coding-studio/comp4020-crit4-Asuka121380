<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Living Score</title>
    <meta
      name="description"
      content="Conduct an invisible ensemble with mouse, touch, or keyboard — a living harmony system chooses each chord as you move."
    />

    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./">The Living Score</a>
      </nav>
    </header>
    <main>
      <h1>The Living Score</h1>

      <div class="controls">
        <button type="button" id="ensemble-toggle" aria-pressed="false">Brass Choir</button>
        <button type="button" id="reset-button">Clear</button>
      </div>

      <p id="status" class="visually-hidden" role="status" aria-live="polite"></p>

      <section
        class="score"
        id="conducting-surface"
        tabindex="0"
        aria-label="Conducting surface. Press and move to conduct; turn to change harmony."
      >
        <div class="chord-symbol" id="chord-symbol" aria-hidden="true"></div>

        <div class="instrument-row" data-voice="soprano">
          <span class="instrument-label">Trumpet / Violin</span>
          <div class="note-lane" id="lane-soprano"></div>
        </div>
        <div class="instrument-row" data-voice="alto">
          <span class="instrument-label">Horn / Viola</span>
          <div class="note-lane" id="lane-alto"></div>
        </div>
        <div class="instrument-row" data-voice="tenor">
          <span class="instrument-label">Trombone / Cello</span>
          <div class="note-lane" id="lane-tenor"></div>
        </div>
        <div class="instrument-row" data-voice="bass">
          <span class="instrument-label">Tuba / Double Bass</span>
          <div class="note-lane" id="lane-bass"></div>
        </div>

        <p class="concert-pitch-label">Concert pitch</p>
        <div class="baton" id="baton" aria-hidden="true"></div>
        <p class="invitation" id="invitation">Hold and conduct.</p>
      </section>

      <p class="keyboard-hint">
        Hold and move to conduct. Turn to change harmony. <kbd>1</kbd> selects Brass,
        <kbd>2</kbd> selects Strings.
      </p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
